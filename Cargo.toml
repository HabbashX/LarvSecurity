[package]
name = "LarvSecurity"
version = "0.1.0"
edition = "2021"
description = "Local-first desktop security toolkit: passwords, JWT, encryption, hashing, keys, encoding, random"
license = "MIT OR Apache-2.0"

[[bin]]
name = "larvsecurity"
path = "src/main.rs"

[dependencies]
eframe = { version = "=0.32.3", features = ["default"] }
egui = { version = "=0.32.3" }
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = { version = "=1.0.143" }
thiserror = { version = "=2.0.12" }
zeroize = { version = "=1.8.1", features = ["zeroize_derive"] }
rand = { version = "=0.8.5" }
uuid = { version = "=1.18.1", features = ["v4"] }
base64 = { version = "=0.22.1" }
hex = { version = "=0.4.3" }
urlencoding = { version = "=2.1.3" }
sha2 = { version = "=0.10.9" }
sha3 = { version = "=0.10.8" }
blake3 = { version = "=1.8.2" }
md-5 = { version = "=0.10.6" }
sha1 = { version = "=0.10.6" }
hmac = { version = "=0.12.1" }
argon2 = { version = "=0.5.3", features = ["std"] }
pbkdf2 = { version = "=0.12.2", features = ["simple"] }
scrypt = { version = "=0.11.0", features = ["simple", "password-hash"] }
aes-gcm = { version = "=0.10.3" }
chacha20poly1305 = { version = "=0.10.1" }
rsa = { version = "=0.9.8", features = ["sha2", "getrandom"] }
p256 = { version = "=0.13.2", features = ["ecdsa", "pkcs8", "pem"] }
p384 = { version = "=0.13.1", features = ["ecdsa", "pkcs8", "pem"] }
p521 = { version = "=0.13.3", features = ["ecdsa", "pkcs8", "pem", "getrandom"] }
ecdsa = { version = "=0.16.9", features = ["der", "pkcs8", "signing", "verifying", "pem"] }
signature = { version = "=2.2.0" }
pkcs8 = { version = "=0.10.2", features = ["pem", "std"] }
pkcs1 = { version = "=0.7.5", features = ["pem"] }
sec1 = { version = "=0.7.3", features = ["pem"] }
rfd = { version = "=0.15.4" }
arboard = { version = "=3.6.1" }
data-encoding = "2"
chrono = "0.4"
regex = "1"
qrcode = "0.14"
ed25519-dalek = { version = "3", features = ["pkcs8", "pem", "rand_core", "alloc", "zeroize"] }
ed25519 = { version = "3", features = ["pkcs8", "pem", "alloc"] }
x509-parser = "0.16"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls-native-roots"] }

[dev-dependencies]
hex-literal = "=0.4.1"

[profile.release]
opt-level = 3
lto = false
codegen-units = 16
strip = true
